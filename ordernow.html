<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>ORDER||PAGE</h1>
    <Fieldset>
        <form action="paymentsuccessful.html" method="get">
            <div>FULL NAME:<input type="text" placeholder="Enter name here"></div>
            <div>PHONE NUMBER:<input type="PHONE" placeholder="Enter number here" maxlength="10" required></div>
            <div>ADDRESS :<input type="text" placeholder="Enter Address here" required></div>
            <div>PAYMENT METHOD:<select name="payment  " id="paymet">
                    <option value="Upi">Upi</option>
                    <option value="Cash ">Cash</option>
                </select></div>
            AMOUNT HERE:<div><input type="text" id="number" placeholder=" Enter amount here"></div>
            <hr>
            <div><input type="submit" value="ORDER"></div>


        </form>
    </Fieldset>



</body>

</html>
